<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study of the Table</title>


    <!-- Link para o CSS -->
     <link rel="stylesheet" href="./css/global.css">
</head>
<body>
    

    <main class="main-content decoration">

        <header class="header-title decoration">
        <h1>Tabelas</h1>
        </header>

        <!-- Criar tabela para notas de alunos -->

        <h2>Notas 2-DS SESI</h2>
        <!-- Container para criar uma tabela -->
        <table>
            <!-- Criar linha da tabela (tr= table row) -->
           
            <tr>
                <!-- Criar um cabeçalho da linha (th = table header) -->
                 <th>Aluno</th>
                 <th>Professor</th>
                 <th>Disciplina</th>
                 <th>Nota</th>
            </tr>
            
            
        </table>

    </main>
</body>
</html>
