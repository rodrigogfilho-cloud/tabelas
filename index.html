<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study of the Table</title>


    <!-- Link para o CSS -->
    <link rel="stylesheet" href="./css/global.css">
</head>

<body>
    <main class="main-content">

        <header class="header-title">
            <h1>Tabelas</h1>

        </header>



        <!-- Criar tabela para notas de alunos -->

        <!-- Container para criar uma tabela (table . table-aluno)-->

        <table class="table-aluno">

            <!-- Definir cabeçalho da tabela (thead = table header) -->
            <thead>

                <tr>
                    <th colspan="4" class="table-alunos__title">Notas 2-DS SESI</th>
                </tr>



                <!-- Criar linha da tabela (tr= table row) -->
                <tr>
                    <!-- Criar um cabeçalho da linha (th = table header) -->
                    <th class="table-alunos__cabecalho">Aluno</th>
                    <th class="table-alunos__cabecalho">Professor</th>
                    <th class="table-alunos__cabecalho">Disciplina</th>
                    <th class="table-alunos__cabecalho">Nota</th>
                </tr>
            </thead>

            <!-- Definir o corpo da tabela (tbody = table body) -->

            <tbody>

                <tr>
                    <!-- Inserir dados na linha (td = table data) -->
                    <td>Godoy</td>
                    <td>Alex</td>
                    <td>DS</td>
                    <td>6.7</td>
                </tr>
                <tr>

                    <td>Nini</td>
                    <td>Ivo</td>
                    <td>PEND</td>
                    <td>0.1</td>
                </tr>
                <tr>

                    <td>Ivo</td>
                    <td>Guiza</td>
                    <td>Matemática</td>
                    <td>5</td>
                </tr>
                <tr>

                    <td>Palma</td>
                    <td>Liliane</td>
                    <td>Química</td>
                    <td>0</td>
                </tr>

                <!-- Definir o rodapé da tabela com tfoot (table footer) -->

                <tfoot>
                    <tr>
                        <td colspan="4">Dados referentes ao 1º Semestre de 2026</td>
                    </tr>
                </tfoot>
            </tbody>
        </table>
    </main>
</body>

</html>
