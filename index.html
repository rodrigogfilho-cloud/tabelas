<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study of the Table</title>


    <!-- Link para o CSS -->
    <link rel="stylesheet" href="./css/global.css">
</head>

<body>
    <main class="main-content">

        <header class="header-title">
            <h1>Tabelas</h1>
        </header>

        <!-- Criar tabela para notas de alunos -->

        <h2>Notas 2-DS SESI</h2>
        <!-- Container para criar uma tabela -->
        <table class="table-aluno">
            <!-- Definir cabeçalho da tabela (thead = table header) -->



            <thead>
                <!-- Criar linha da tabela (tr= table row) -->
                <tr>
                    <!-- Criar um cabeçalho da linha (th = table header) -->
                    <th>Aluno</th>
                    <th>Professor</th>
                    <th>Disciplina</th>
                    <th>Nota</th>
                </tr>
            </thead>

            <!-- Definir o corpo da tabela (tbody = table body) -->

            <tbody>

                <tr>
                    <!-- Inserir dados na linha (td = table data) -->
                    <td>Godoy</td>
                    <td>Alex</td>
                    <td>DS</td>
                    <td>6.7</td>
                </tr>
                <tr>
                    
                    <td>Nini</td>
                    <td>Ivo</td>
                    <td>PEND</td>
                    <td>0.1</td>
                </tr>
                <tr>
                    
                    <td>Ivo</td>
                    <td>Guiza</td>
                    <td>Matemática</td>
                    <td>5</td>
                </tr>
                <tr>
                   
                    <td>Palma</td>
                    <td>Liliane</td>
                    <td>Química</td>
                    <td>0</td>
                </tr>

                <!-- Definir o rodapé da tabela com tfoot (table footer) -->

                <tfoot>
                    <tr>
                        <td colspan="4">Dados referentes ao 1º Semestre de 2026</td>
                    </tr>
                </tfoot>


            </tbody>


        </table>

        <table class="table-">
            <tr>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tr>


        </table>

    </main>
</body>

</html>
